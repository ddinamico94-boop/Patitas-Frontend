
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO principal -->
    <title>Patitas Tucumán | Animales perdidos, encontrados y en adopción</title>

    <meta
      name="description"
      content="Patitas Tucumán es una plataforma comunitaria para reportar, encontrar y adoptar animales perdidos, encontrados, rescatados o en situación de calle en Tucumán."
    />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Patitas Tucumán" />
    <meta name="theme-color" content="#C05B3A" />

    <!-- URL canónica -->
    <link
      rel="canonical"
      href="https://www.patitastucuman.com.ar/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph: Facebook, WhatsApp y otras plataformas -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Patitas Tucumán" />

    <meta
      property="og:title"
      content="Patitas Tucumán | Animales perdidos, encontrados y en adopción"
    />

    <meta
      property="og:description"
      content="Reportá animales perdidos, ayudá a encontrar a sus familias y conocé animales en adopción en Tucumán."
    />

    <meta
      property="og:url"
      content="https://www.patitastucuman.com.ar/"
    />

    <meta
      property="og:image"
      content="https://www.patitastucuman.com.ar/og-image.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Patitas Tucumán - Plataforma comunitaria de ayuda animal"
    />

    <meta property="og:locale" content="es_AR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Patitas Tucumán | Animales perdidos, encontrados y en adopción"
    />

    <meta
      name="twitter:description"
      content="Reportá, encontrá y ayudá a animales perdidos, rescatados o en adopción en Tucumán."
    />

    <meta
      name="twitter:image"
      content="https://www.patitastucuman.com.ar/og-image.png"
    />

    <!-- Datos estructurados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Patitas Tucumán",
        "url": "https://www.patitastucuman.com.ar/",
        "description": "Plataforma comunitaria para reportar, encontrar y adoptar animales en Tucumán.",
        "inLanguage": "es-AR"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
